<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Unable to open Covault</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 28px;
        border: 1px solid #e2e8f0;
        border-radius: 32px;
        background: #ffffff;
      }
      h1 { margin: 0 0 16px; font-size: 28px; line-height: 1.2; letter-spacing: -0.03em; }
      p { margin: 0 0 16px; }
      p:last-child { margin-bottom: 0; }
      @media (prefers-color-scheme: dark) {
        body { background: #020617; color: #f8fafc; }
        main { background: #0f172a; border-color: #1e293b; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Unable to open Covault</h1>
      <p>Covault needs an up-to-date browser on your phone.</p>
      <p>Check your app store for updates to Android System WebView and Google Chrome, then close and reopen Covault.</p>
      <p>If both are up to date and the app still will not open, contact the person who provided your app.</p>
    </main>
  </body>
</html>
