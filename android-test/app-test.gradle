// Applied only by prepare-android-tests.sh to the disposable generated project.
android {
    defaultConfig {
        applicationId 'com.covault.app.test'
        testApplicationId 'com.covault.app.test.test'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Ignore Capacitor's generated sample test, which assumes its template app ID.
        testInstrumentationRunnerArguments 'class': 'com.covault.app.NativeCaptureTest'
        versionCode 1
        versionName 'android-ci'
    }
}

dependencies {
    // Normal Android workflow adds this for the custom native biometric plugin.
    implementation 'androidx.biometric:biometric:1.1.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}
