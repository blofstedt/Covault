
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="google-site-verification" content="qdCTnrhPaXD9i5snJTZ9V9K_QEbg5wiFDMZUeB3brHo" />
    <title>Covault v1</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet" />

    <script>
      /*
        Pick the theme before the first paint.

        React only adds `dark` to <html> once it has mounted and read the
        stored settings, which is several hundred milliseconds into a cold
        start on a phone. Until then the body renders light, so a dark vault
        opened to a white flash every single time.

        Anything other than an explicit 'light' means dark, which is also what
        makes dark the default for a vault that has never chosen. The key and
        shape here mirror SETTINGS_KEY / DEFAULT_SETTINGS in App.tsx.
      */
      try {
        var stored = localStorage.getItem('covault_settings');
        var theme = stored ? JSON.parse(stored).theme : null;
        if (theme !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      input, textarea, [contenteditable="true"] {
        -webkit-user-select: text;
        user-select: text;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: 'Inter', sans-serif;
        transition: background-color 0.7s ease, color 0.7s ease;
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
